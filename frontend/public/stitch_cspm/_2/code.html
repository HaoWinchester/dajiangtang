<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                    "on-tertiary-container": "#b4bbd5",
                    "primary-fixed-dim": "#b8c4ff",
                    "surface-container-high": "#e8e7f1",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#d5e3fc",
                    "primary-container": "#1e40af",
                    "outline-variant": "#c4c5d5",
                    "tertiary": "#2d3449",
                    "surface-bright": "#fbf8ff",
                    "on-error": "#ffffff",
                    "surface-variant": "#e3e1eb",
                    "on-secondary": "#ffffff",
                    "inverse-surface": "#2f3037",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f4f2fc",
                    "surface-container": "#eeedf7",
                    "secondary": "#515f74",
                    "primary": "#00288e",
                    "on-primary-fixed": "#001453",
                    "secondary-container": "#d5e3fc",
                    "surface-container-highest": "#e3e1eb",
                    "error-container": "#ffdad6",
                    "on-surface": "#1a1b22",
                    "on-tertiary": "#ffffff",
                    "tertiary-fixed-dim": "#bec6e0",
                    "outline": "#757684",
                    "on-background": "#1a1b22",
                    "tertiary-container": "#434b60",
                    "on-tertiary-fixed-variant": "#3f465c",
                    "background": "#fbf8ff",
                    "surface-tint": "#3755c3",
                    "primary-fixed": "#dde1ff",
                    "surface-dim": "#dad9e3",
                    "on-secondary-fixed": "#0d1c2e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "3xl": "64px",
                    "lg": "24px",
                    "xl": "32px",
                    "md": "16px",
                    "max_width": "1440px",
                    "2xl": "48px",
                    "sm": "8px",
                    "gutter": "24px",
                    "xs": "4px",
                    "margin": "32px",
                    "base": "4px"
            },
            "fontFamily": {
                    "h2": ["Inter"],
                    "h3": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],

                    "code": ["Inter"]
            },
            "fontSize": {
                    "h2": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "h3": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "h1": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "code": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]

          }
        }
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .puzzle-overlay {
            backdrop-filter: blur(4px);
            background-color: rgba(15, 23, 42, 0.4);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- TopAppBar from JSON Authority -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
<div class="flex justify-between items-center h-16 w-full px-6">
<div class="text-xl font-bold text-blue-900 dark:text-white font-['Inter'] antialiased tracking-tight">项目管理人才库</div>
<nav class="hidden md:flex items-center space-x-8">
<a class="text-slate-600 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors font-['Inter'] antialiased tracking-tight" href="#">Opportunities</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors font-['Inter'] antialiased tracking-tight" href="#">Resources</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors font-['Inter'] antialiased tracking-tight" href="#">About</a>
</nav>
<div class="flex items-center space-x-4">
<button class="px-4 py-2 text-blue-800 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors rounded-lg font-medium">Log In</button>
<button class="px-4 py-2 bg-primary text-white hover:opacity-90 rounded-lg font-medium">Sign Up</button>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-lg p-xl space-y-lg">
<div class="text-center space-y-sm">
<h1 class="font-h1 text-h1 text-primary">欢迎回来</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">请登录您的 项目管理人才库 账户以继续</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault(); document.getElementById('captcha-modal').classList.remove('hidden');">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface">用户名 / 邮箱</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded border border-outline/30 focus:ring-2 focus:ring-primary focus:border-transparent outline-none bg-white transition-all" placeholder="请输入您的用户名" required="" type="text"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface">密码</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">忘记密码？</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded border border-outline/30 focus:ring-2 focus:ring-primary focus:border-transparent outline-none bg-white transition-all" placeholder="请输入您的密码" required="" type="password"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline cursor-pointer" data-icon="visibility">visibility</span>
</div>
</div>
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline/30 text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">记住设备（30天内）</label>
</div>
<button class="w-full bg-primary text-white py-3 rounded-lg font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all shadow-md shadow-primary/20" type="submit">
                    立即登录
                </button>
</form>
</div>
</main>
<!-- Verification Modal -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center puzzle-overlay" id="captcha-modal">
<div class="bg-white rounded-xl shadow-2xl p-lg w-[360px] space-y-md border border-outline-variant">
<div class="flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface">安全验证</span>
<button class="text-outline hover:text-on-surface" onclick="document.getElementById('captcha-modal').classList.add('hidden')">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="relative rounded-lg overflow-hidden bg-slate-100 aspect-[4/3] group">
<img class="w-full h-full object-cover" data-alt="A sophisticated corporate office interior featuring clean lines, glass partitions, and a palette of deep navy blue and soft gray. The setting is professionally lit with warm ambient light, creating a trustworthy and high-end recruitment agency atmosphere. The background is slightly blurred to emphasize the foreground verification element, maintaining a light-mode modern aesthetic." src="/assets/stitch-local-images/stitch-image-14-d3402f3d07.png"/>
<!-- Puzzle Piece Placeholder -->
<div class="absolute top-1/2 left-12 w-12 h-12 bg-white/20 border-2 border-white/50 rounded-lg backdrop-blur-sm shadow-xl"></div>
<div class="absolute top-1/2 left-32 w-12 h-12 bg-primary/40 border-2 border-primary/60 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white" data-icon="extension">extension</span>
</div>
</div>
<div class="space-y-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">拖动滑块完成拼图</p>
<div class="relative h-10 bg-surface-container rounded-full border border-outline/20">
<div class="absolute left-0 top-0 h-full bg-primary/10 rounded-full" style="width: 40%"></div>
<div class="absolute left-[35%] top-1/2 -translate-y-1/2 w-12 h-12 bg-primary rounded-full shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing border-4 border-white">
<span class="material-symbols-outlined text-white" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
<div class="flex justify-between items-center pt-2 border-t border-outline/10">
<div class="flex space-x-4">
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary" data-icon="refresh">refresh</span>
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary" data-icon="help">help</span>
</div>
<span class="text-[10px] text-outline">Verification by 项目管理人才库</span>
</div>
</div>
</div>
<!-- Footer from JSON Authority -->
<footer class="bg-slate-50 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800">
<div class="flex flex-col md:flex-row justify-between items-center py-8 px-6 max-w-[1440px] mx-auto">
<div class="font-bold text-slate-900 dark:text-slate-100 mb-4 md:mb-0">项目管理人才库</div>
<div class="font-['Inter'] text-sm text-slate-500 dark:text-slate-400 mb-4 md:mb-0">
                © 2024 项目管理人才库 Human Capital Management. All rights reserved.
            </div>
<div class="flex space-x-6">
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-800 dark:hover:text-blue-200 transition-colors text-sm font-['Inter']" href="#">Privacy Policy</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-800 dark:hover:text-blue-200 transition-colors text-sm font-['Inter']" href="#">Terms of Service</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-800 dark:hover:text-blue-200 transition-colors text-sm font-['Inter']" href="#">Contact Support</a>
</div>
</div>
</footer>
<script src="/stitch_cspm/stitch-actions.js"></script>
</body></html>
